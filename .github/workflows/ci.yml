name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
          components: clippy

      - name: Set up matching Clang and libclang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 libclang-18-dev
          echo "CLANG_PATH=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - run: cargo clippy --release -- -D warnings

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Set up matching Clang and libclang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 libclang-18-dev
          echo "CLANG_PATH=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - run: cargo test

  php-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php-version }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
          components: rustfmt

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Set rustfmt for bindgen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup component add rustfmt
          $rustfmt = & rustup which rustfmt
          echo "RUSTFMT=$rustfmt" >> $env:GITHUB_ENV

      - run: composer install --no-interaction

      - name: Set up matching Clang and libclang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 libclang-18-dev
          echo "CLANG_PATH=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - run: cargo build --release

      - name: Run PHPUnit (Linux)
        if: runner.os == 'Linux'
        run: |
          EXT=$(pwd)/target/release/libpqcrypto.so
          php -d "extension=${EXT}" vendor/bin/phpunit

      - name: Run PHPUnit (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXT_DIR="$(php -r "echo ini_get('extension_dir');")"
          cp target/release/pqcrypto.dll "${EXT_DIR}/pqcrypto.dll"
          echo "extension=pqcrypto" >> "$(php -r "echo php_ini_loaded_file();")"
          php -m | grep pqcrypto
          php vendor/bin/phpunit
